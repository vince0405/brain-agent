services:
  brain-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-production-agent
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/brain.db
    volumes:
      - brain_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  brain_data:

